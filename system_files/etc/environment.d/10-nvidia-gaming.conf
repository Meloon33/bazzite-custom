# Optimizations for NVIDIA GeForce RTX 4080 Super on Bazzite

# Enable DLSS, DLAA, and Reflex in Proton games
PROTON_ENABLE_NVAPI=1
DXVK_ENABLE_NVAPI=1

# Enable DirectX Raytracing (DXR) in VKD3D-Proton
VKD3D_CONFIG=dxr11

# Enable G-Sync / Variable Refresh Rate (VRR)
__GL_VRR_ALLOWED=1
__GL_GSYNC_ALLOWED=1

# Hardware accelerated video decode
LIBVA_DRIVER_NAME=nvidia
GBM_BACKEND=nvidia-drm
__GLX_VENDOR_LIBRARY_NAME=nvidia
